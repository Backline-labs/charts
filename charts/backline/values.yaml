# Global configuration
accessKey: ""
namespaceOverride: "backline"

# ============================================================================
# OUTBOUND PROXY (optional)
# ============================================================================
# For clusters that route egress through a corporate proxy. When set, these are
# injected (both upper- and lower-case) into the worker, gitproxy and janitor
# containers. Leave empty to connect directly.
# Include your internal hosts (e.g. a self-hosted git server) and in-cluster
# addresses in noProxy so they are reached directly, not through the proxy.
proxy:
  httpProxy: ""
  httpsProxy: ""
  noProxy: ""

# ============================================================================
# CUSTOM CA (optional)
# ============================================================================
# Base64-encoded PEM CA certificate(s) used for trusted communication with a
# self-hosted git host signed by an internal/corporate CA.
# Generate with:  base64 -w0 ca.pem   (or:  base64 < ca.pem | tr -d '\n')
customCaCert: ""

# ============================================================================
# EXTERNAL SECRETS (optional)
# ============================================================================
# Source chart secrets from any secret manager the External Secrets Operator
# supports (https://external-secrets.io): AWS, Azure, Google, Vault, ... Enabling
# a secret below renders an ExternalSecret in place of the Secret; the operator
# syncs the provider value into a Secret of the same name, so nothing else in
# the chart changes. The operator and a SecretStore/ClusterSecretStore must
# already exist. Inline values (accessKey, customCaCert, objectStorage.*) are
# ignored for a secret that is enabled here. Enabling or disabling a secret on
# an existing install is an ordinary helm upgrade; the Secret object is handed
# over between Helm and the operator without being recreated.
externalSecrets:
  # ESO 0.17+ serves external-secrets.io/v1; older operators need v1beta1.
  apiVersion: external-secrets.io/v1
  # Defaults for every ExternalSecret below. Any secret may carry its own
  # secretStoreRef / refreshInterval to override them.
  secretStoreRef:
    name: ""
    kind: SecretStore # or ClusterSecretStore
  refreshInterval: 1h
  # remoteRef blocks are passed to ESO verbatim: key is required; property,
  # version, decodingStrategy, ... are accepted as-is.

  # Backline access key -> Secret "accesskey" (key ACCESS_KEY)
  accessKey:
    enabled: false
    remoteRef:
      key: ""
  # Internal CA bundle -> Secret "custom-ca" (key ca.crt). The remote value
  # must be PEM; add `decodingStrategy: Base64` if it is stored base64-encoded.
  customCaCert:
    enabled: false
    remoteRef:
      key: ""
  # SeaweedFS S3 credentials -> Secret "seaweedfs-s3-secret". The gateway's
  # identity config is derived from the two fetched values.
  objectStorage:
    enabled: false
    accessKey:
      remoteRef:
        key: ""
    secretKey:
      remoteRef:
        key: ""

# OBJECT STORAGE (SeaweedFS, S3-compatible)
objectStorage:
  accessKey: "backline"
  # How long objects in the operational bucket are kept (empty = 7d). The window binds
  # at write time; objects stored without one are removed on install/upgrade.
  operationalRetention: ""
  # Leave empty to generate a random key on first install; upgrades keep it. Set it
  # when rendering without cluster access (helm template, Argo CD), or it changes each render.
  secretKey: ""

seaweedfs:
  enabled: true
  fullnameOverride: seaweedfs
  master:
    enabled: false
  volume:
    enabled: false
    # all-in-one derives -volume.max from the first dataDir; pin an explicit count.
    # Auto (0) sizes the cap by disk (~9 for a 10Gi PVC), too few once each bucket
    # gets its own collection. Volumes grow on demand; minFreeSpacePercent guards the disk.
    dataDirs:
      - name: data1
        type: hostPath
        hostPathPrefix: /ssd
        maxVolumes: 100
  filer:
    enabled: false
    port: 8888
    # Read by the bucket-creation hook even with the filer disabled.
    podSecurityContext: &seaweedfsPodSecurityContext
      enabled: true
      # The image's own seaweed user; fsGroup lets it take over data written as root.
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext: &seaweedfsContainerSecurityContext
      enabled: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  s3:
    enabled: false
    port: 8333
  allInOne:
    enabled: true
    data:
      type: persistentVolumeClaim
      size: 10Gi
      storageClass: ""
    s3:
      enabled: true
      enableAuth: true
      existingConfigSecret: seaweedfs-s3-secret
      # Buckets come from files/buckets.yaml via the chart's own hook; keep this empty.
      createBuckets: []
    podSecurityContext: *seaweedfsPodSecurityContext
    containerSecurityContext: *seaweedfsContainerSecurityContext
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    # weed reads logging flags only before `server`, and this is the only value the subchart places there.
    loggingOverrideLevel: "1 -logdir=/var/log/backline -log_json -log_max_size_mb=20 -log_max_files=2"
    sidecars: '{{ include "adot.seaweedfsSidecar" . }}'
    extraVolumes: '{{ include "adot.seaweedfsVolumes" . }}'
    extraVolumeMounts: '{{ include "adot.logVolumeMount" (dict "readOnly" false) }}'
    # Log sidecar image for the SeaweedFS pod. Set it to the same image when worker.otel.collector.image is set.
    collectorImage: ""

# Janitor component
janitor:
  image:
    # Point at a mirror of docker.io if the cluster cannot pull from it directly.
    registry: docker.io
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

# Worker component
worker:
  replicaCount: 1
  image:
    # Leave empty: the janitor keeps the image on the newest published build and
    # helm upgrade preserves the tag it set. A tag set here is not a pin: each
    # helm upgrade applies it, then the janitor moves on to the newest build.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ============================================================================
# GITPROXY COMPONENT (On-prem git server connectivity)
# ============================================================================
gitproxy:
  # Enable when Backline must reach an on-prem git server (e.g. Bitbucket Data Center).
  enabled: false
  replicaCount: 1
  image:
    # Leave empty: the janitor keeps the image on the newest published build and
    # helm upgrade preserves the tag it set. A tag set here is not a pin: each
    # helm upgrade applies it, then the janitor moves on to the newest build.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ============================================================================
# RESOURCE PROFILES FOR EPHEMERAL JOBS
# ============================================================================
resourceProfiles:
  small:
    requests:
      cpu: "250m"
      memory: "1Gi"
      ephemeral-storage: "10Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  medium:
    requests:
      cpu: "500m"
      memory: "4Gi"
      ephemeral-storage: "10Gi"
    limits:
      cpu: "2000m"
      memory: "8Gi"
  large:
    requests:
      cpu: "1000m"
      memory: "8Gi"
      ephemeral-storage: "10Gi"
    limits:
      cpu: "4000m"
      memory: "16Gi"
  xlarge:
    requests:
      cpu: "2000m"
      memory: "16Gi"
      ephemeral-storage: "10Gi"
    limits:
      cpu: "8000m"
      memory: "32Gi"
