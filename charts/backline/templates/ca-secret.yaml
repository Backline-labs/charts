{{- if ((.Values.externalSecrets).customCaCert).enabled }}
apiVersion: {{ include "backline.externalSecret.apiVersion" . }}
kind: ExternalSecret
metadata:
  name: custom-ca
  namespace: {{ default .Release.Namespace .Values.namespaceOverride | trunc 63 | trimSuffix "-" }}
spec:
  {{- include "backline.externalSecret.specCommon" (dict "root" . "cfg" .Values.externalSecrets.customCaCert "path" "externalSecrets.customCaCert") | nindent 2 }}
  target:
    name: custom-ca
    # Orphan: no ownerReference, so a later switch back to inline values keeps the Secret.
    creationPolicy: Orphan
  data:
    # The remote value must be the PEM bundle itself; add decodingStrategy: Base64
    # to the remoteRef if the provider stores it base64-encoded.
    - secretKey: ca.crt
      {{- include "backline.externalSecret.remoteRef" (dict "remoteRef" .Values.externalSecrets.customCaCert.remoteRef "path" "externalSecrets.customCaCert") | nindent 6 }}
{{- else if .Values.customCaCert }}
apiVersion: v1
kind: Secret
metadata:
  name: custom-ca
  namespace: {{ default .Release.Namespace .Values.namespaceOverride | trunc 63 | trimSuffix "-" }}
  annotations:
    # Kept when it leaves the release so a switch to ExternalSecrets reuses this object.
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Base64-encoded PEM CA bundle; nospace tolerates line-wrapped base64.
  ca.crt: {{ .Values.customCaCert | nospace | quote }}
{{- end }}
