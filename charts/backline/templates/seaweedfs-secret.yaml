{{- if .Values.seaweedfs.enabled }}
{{- if ((.Values.externalSecrets).objectStorage).enabled }}
{{- $es := .Values.externalSecrets.objectStorage }}
apiVersion: {{ include "backline.externalSecret.apiVersion" . }}
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-secret
  namespace: {{ default .Release.Namespace .Values.namespaceOverride | trunc 63 | trimSuffix "-" }}
  labels:
    app: seaweedfs
spec:
  {{- include "backline.externalSecret.specCommon" (dict "root" . "cfg" $es "path" "externalSecrets.objectStorage") | nindent 2 }}
  target:
    name: seaweedfs-s3-secret
    # Orphan: no ownerReference, so a later switch back to inline values keeps the Secret.
    creationPolicy: Orphan
    # The gateway's identity file is derived from the two fetched credentials. ESO
    # evaluates the {{ "{{ }}" }} placeholders below; Helm leaves them untouched.
    template:
      engineVersion: v2
      # Template metadata replaces what ESO would otherwise copy from this object, so
      # restate Helm's ownership metadata: a later upgrade with the ExternalSecret
      # disabled can then re-adopt the Secret instead of failing on "already exists".
      metadata:
        labels:
          app: seaweedfs
          app.kubernetes.io/managed-by: {{ .Release.Service }}
        annotations:
          meta.helm.sh/release-name: {{ .Release.Name }}
          meta.helm.sh/release-namespace: {{ .Release.Namespace }}
      data:
        accessKey: {{ "{{ .accessKey }}" | quote }}
        secretKey: {{ "{{ .secretKey }}" | quote }}
        seaweedfs_s3_config: {{ dict "identities" (list (dict "name" "backline" "credentials" (list (dict "accessKey" "{{ .accessKey }}" "secretKey" "{{ .secretKey }}")) "actions" (list "Admin" "Read" "Write" "List" "Tagging"))) | toJson | quote }}
  data:
    - secretKey: accessKey
      {{- include "backline.externalSecret.remoteRef" (dict "remoteRef" ($es.accessKey).remoteRef "path" "externalSecrets.objectStorage.accessKey") | nindent 6 }}
    - secretKey: secretKey
      {{- include "backline.externalSecret.remoteRef" (dict "remoteRef" ($es.secretKey).remoteRef "path" "externalSecrets.objectStorage.secretKey") | nindent 6 }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-secret
  namespace: {{ default .Release.Namespace .Values.namespaceOverride | trunc 63 | trimSuffix "-" }}
  annotations:
    # Kept when it leaves the release so a switch to ExternalSecrets reuses this object.
    helm.sh/resource-policy: keep
  labels:
    app: seaweedfs
type: Opaque
stringData:
  accessKey: {{ .Values.objectStorage.accessKey | quote }}
  secretKey: {{ .Values.objectStorage.secretKey | quote }}
  seaweedfs_s3_config: {{ dict "identities" (list (dict "name" "backline" "credentials" (list (dict "accessKey" .Values.objectStorage.accessKey "secretKey" .Values.objectStorage.secretKey)) "actions" (list "Admin" "Read" "Write" "List" "Tagging"))) | toJson | quote }}
{{- end }}
{{- end }}
