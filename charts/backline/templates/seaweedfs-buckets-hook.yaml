{{- if .Values.seaweedfs.enabled }}
{{- $sw := .Subcharts.seaweedfs }}
{{- $buckets := include "backline.buckets" . | fromJson }}
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-buckets
  namespace: {{ default .Release.Namespace .Values.namespaceOverride | trunc 63 | trimSuffix "-" }}
  labels:
    app: seaweedfs
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # Runs after the subchart's bucket hook, which legacy createBuckets values can still render.
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      restartPolicy: Never
      securityContext:
        {{- omit .Values.seaweedfs.filer.podSecurityContext "enabled" | toYaml | nindent 8 }}
      containers:
      - name: create-buckets
        image: {{ include "seaweedfs.master.image" $sw }}
        imagePullPolicy: {{ $sw.Values.global.seaweedfs.imagePullPolicy | default "IfNotPresent" }}
        securityContext:
          {{- omit .Values.seaweedfs.filer.containerSecurityContext "enabled" | toYaml | nindent 10 }}
        resources:
          {{- toYaml .Values.janitor.resources | nindent 10 }}
        env:
        - name: WEED_CLUSTER_DEFAULT
          value: "sw"
        - name: WEED_CLUSTER_SW_MASTER
          value: {{ include "seaweedfs.cluster.masterAddress" $sw | quote }}
        - name: WEED_CLUSTER_SW_FILER
          value: {{ include "seaweedfs.cluster.filerAddress" $sw | quote }}
        command:
        - /bin/sh
        - -ec
        - |
          set -o pipefail

          wait_for_service() {
            attempt=1
            while [ $attempt -le 60 ]; do
              if wget -q --spider "$1" >/dev/null 2>&1; then echo "$1 is up"; return 0; fi
              echo "Attempt $attempt: $1 not ready yet, retrying in 5s..."
              sleep 5
              attempt=$((attempt + 1))
            done
            echo "$1 did not become ready within 5 minutes"
            exit 1
          }

          wait_for_service "http://$WEED_CLUSTER_SW_MASTER/cluster/status"
          wait_for_service "http://$WEED_CLUSTER_SW_FILER/"

          existing=$(echo 's3.bucket.list' | weed shell | awk '{print $1}')
          {{- range $name, $bucket := $buckets }}
          if echo "$existing" | grep -Fxq {{ $name | squote }}; then
            echo "Bucket {{ $name }} already exists"
          else
            echo "Creating bucket {{ $name }}"
            echo 's3.bucket.create -name {{ $name }}' | weed shell
          fi
          {{- if $bucket.ttl }}
          echo "Setting ttl {{ $bucket.ttl }} on bucket {{ $name }}"
          echo 'fs.configure -locationPrefix=/buckets/{{ $name }}/ -ttl={{ $bucket.ttl }} -apply' | weed shell
          {{- end }}
          {{- end }}
{{- end }}
