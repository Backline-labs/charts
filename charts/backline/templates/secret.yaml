{{- include "common.validateRequired" . -}}
{{- if ((.Values.externalSecrets).accessKey).enabled }}
apiVersion: {{ include "backline.externalSecret.apiVersion" . }}
kind: ExternalSecret
metadata:
  name: accesskey
  namespace: {{ default .Release.Namespace .Values.namespaceOverride | trunc 63 | trimSuffix "-" }}
spec:
  {{- include "backline.externalSecret.specCommon" (dict "root" . "cfg" .Values.externalSecrets.accessKey "path" "externalSecrets.accessKey") | nindent 2 }}
  target:
    name: accesskey
    # Orphan: no ownerReference, so a later switch back to inline values keeps the Secret.
    creationPolicy: Orphan
  data:
    - secretKey: ACCESS_KEY
      {{- include "backline.externalSecret.remoteRef" (dict "remoteRef" .Values.externalSecrets.accessKey.remoteRef "path" "externalSecrets.accessKey") | nindent 6 }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: accesskey
  namespace: {{ default .Release.Namespace .Values.namespaceOverride | trunc 63 | trimSuffix "-" }}
  annotations:
    # Kept when it leaves the release so a switch to ExternalSecrets reuses this object.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ACCESS_KEY: {{ .Values.accessKey | quote }}
{{- end }}
