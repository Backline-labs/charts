suite: agentic step job spec
set:
  accessKey: test-key
capabilities:
  majorVersion: 1
  minorVersion: 30
tests:
  - it: pulls the step image with the install's registry login
    template: templates/worker-configmap.yaml
    asserts:
      - matchRegex:
          path: data.CODER_AGENTIC_STEP_JOB_SPEC
          pattern: '"imagePullSecrets":\[\{"name":"dockerconfig"\}\]'

  - it: ships the step's log file through the collector
    template: templates/worker-configmap.yaml
    asserts:
      - matchRegex:
          path: data.CODER_AGENTIC_STEP_JOB_SPEC
          pattern: '"name":"adot-collector"'
      - matchRegex:
          path: data.CODER_AGENTIC_STEP_JOB_SPEC
          pattern: '\{"name":"LOG_FILE","value":"/var/log/backline/agentic.log"\}'

  - it: keeps the step's root filesystem read-only
    template: templates/worker-configmap.yaml
    asserts:
      - matchRegex:
          path: data.CODER_AGENTIC_STEP_JOB_SPEC
          pattern: '"name":"agentic","securityContext":\{"allowPrivilegeEscalation":false,"capabilities":\{"drop":\["ALL"\]\},"readOnlyRootFilesystem":true\}'

  - it: gives the step a writable home and /tmp
    template: templates/worker-configmap.yaml
    asserts:
      - matchRegex:
          path: data.CODER_AGENTIC_STEP_JOB_SPEC
          pattern: '\{"emptyDir":\{\},"name":"home-volume"\}'
      - matchRegex:
          path: data.CODER_AGENTIC_STEP_JOB_SPEC
          pattern: '\{"emptyDir":\{\},"name":"tmp-volume"\}'

  - it: mounts only the log folder and scratch volumes in the step, never the session token
    template: templates/worker-configmap.yaml
    asserts:
      - matchRegex:
          path: data.CODER_AGENTIC_STEP_JOB_SPEC
          pattern: '"name":"agentic","securityContext":\{[^}]*\{[^}]*\}[^}]*\},"volumeMounts":\[\{"mountPath":"/var/log/backline","name":"shared-logs","readOnly":false\},\{"mountPath":"/home/app_user","name":"home-volume"\},\{"mountPath":"/tmp","name":"tmp-volume"\}\]\}'

  - it: leaves the step container its image's entrypoint
    template: templates/worker-configmap.yaml
    asserts:
      - notMatchRegex:
          path: data.CODER_AGENTIC_STEP_JOB_SPEC
          pattern: '"command"'

  - it: runs no collector before native sidecars exist
    template: templates/worker-configmap.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 28
    asserts:
      - notMatchRegex:
          path: data.CODER_AGENTIC_STEP_JOB_SPEC
          pattern: '"adot-collector"'
      - matchRegex:
          path: data.CODER_AGENTIC_STEP_JOB_SPEC
          pattern: '"imagePullSecrets":\[\{"name":"dockerconfig"\}\]'

  - it: carries podAnnotations to step pods
    template: templates/worker-configmap.yaml
    set:
      podAnnotations:
        traffic.sidecar.istio.io/excludeOutboundIPRanges: 10.0.0.0/24
    asserts:
      - matchRegex:
          path: data.CODER_AGENTIC_STEP_JOB_SPEC
          pattern: '"annotations":\{"traffic.sidecar.istio.io/excludeOutboundIPRanges":"10.0.0.0/24"\}'
