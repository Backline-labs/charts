name: README Version Sync

on:
  pull_request:
    paths:
      - 'charts/*/Chart.yaml'
      - 'charts/*/README.md'
      - '.github/workflows/readme-version.yaml'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      APP_CONFIGURED: ${{ vars.CHART_SYNC_APP_CLIENT_ID != '' }}
    steps:
      # A GITHUB_TOKEN push would hold the PR's checks for manual approval; an app token does not.
      - name: Create app token
        id: app-token
        if: env.SAME_REPO == 'true' && env.APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CHART_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHART_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Copy Chart.yaml versions into README.md
        run: |
          for chart in charts/*/Chart.yaml; do
            readme="$(dirname "$chart")/README.md"
            [ -f "$readme" ] || continue
            for field in "version:Chart Version" "appVersion:App Version"; do
              key=${field%%:*}
              label=${field#*:}
              value=$(awk -v k="$key" '$1 == k":" { gsub(/"/, "", $2); print $2; exit }' "$chart")
              if ! grep -q "^\*\*$label:\*\*" "$readme"; then
                echo "::warning file=$readme::no '**$label:**' line to update"
                continue
              fi
              sed -i "s/^\*\*$label:\*\*.*/**$label:** $value/" "$readme"
            done
          done
          git diff --stat

      - name: Push the update to the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if git diff --quiet; then
            echo "README versions already match Chart.yaml"
            exit 0
          fi
          if [ "$SAME_REPO" != "true" ] || [ "$APP_CONFIGURED" != "true" ]; then
            git diff
            reason="fork branches cannot be updated automatically"
            [ "$SAME_REPO" = "true" ] && reason="set the CHART_SYNC_APP_CLIENT_ID variable and CHART_SYNC_APP_PRIVATE_KEY secret to enable automatic updates"
            echo "::error::README versions differ from Chart.yaml; apply the diff above ($reason)"
            exit 1
          fi
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -am "Sync README chart versions with Chart.yaml"
          git push
